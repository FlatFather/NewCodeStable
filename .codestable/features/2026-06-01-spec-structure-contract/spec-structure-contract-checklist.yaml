feature: 2026-06-01-spec-structure-contract
created: 2026-06-01

steps:
  - action: "共享契约骨架：在 shared conventions 中写清 design、feature-plan、checklist、acceptance 的职责边界与 legacy/hybrid 兼容规则"
    exit_signal: "共享副本能直接回答四类产物各写什么、各不写什么"
    status: done

  - action: "入口与设计阶段对齐：更新 cs-feat 与 cs-feat-design 的目录结构、阶段描述与产物边界"
    exit_signal: "入口和设计阶段文档不再把 checklist 当 hybrid feature 的详细步骤正文"
    status: done

  - action: "实现与验收阶段对齐：更新 cs-feat-impl 与 cs-feat-accept 的消费口径"
    exit_signal: "下游文档能明确区分 scope source、step source、status carrier、verification sink"
    status: done

  - action: "读者视图收口：同步 system-overview 与 README 中和 feature 目录及阶段流相关的说明"
    exit_signal: "外部读者看到的目录结构与阶段说明不再和共享约定冲突"
    status: done

  - action: "一致性复核：统一 feature-plan、legacy、hybrid、checklist 职责等术语并做 grep 检查"
    exit_signal: "同一职责不再被两份不同文档重复或冲突定义"
    status: done

