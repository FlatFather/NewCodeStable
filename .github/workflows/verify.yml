name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run workflow quality gates
        env:
          VERIFY_INSTALLED_SKILLS: '0'
        run: ./scripts/verify.sh
